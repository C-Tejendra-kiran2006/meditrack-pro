<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediTrack Pro — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --navy: #050e2b; --blue: #0a2463; --accent: #00d4ff; --accent2: #00ff99;
  --card: rgba(255,255,255,0.04); --border: rgba(0,212,255,0.2);
  --text: #e8f4ff; --muted: rgba(232,244,255,0.5);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--navy); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.bg-grid { position:fixed; inset:0; background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px); background-size:50px 50px; animation:gridShift 20s linear infinite; }
@keyframes gridShift { 0%{transform:translateY(0)} 100%{transform:translateY(50px)} }
.bg-glow { position:fixed; width:500px; height:500px; border-radius:50%; filter:blur(100px); opacity:0.12; }
.bg-glow-1 { background:var(--accent); top:-150px; right:-150px; }
.bg-glow-2 { background:#4f46e5; bottom:-150px; left:-150px; }

.card {
  position: relative; z-index: 1;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 50px;
  width: 500px;
  max-width: 95vw;
}
.logo { display:flex; align-items:center; gap:12px; margin-bottom:36px; }
.logo-icon { width:44px; height:44px; background:linear-gradient(135deg,var(--accent),#4f46e5); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; }
.logo-text span:first-child { display:block; font-family:'Syne',sans-serif; font-size:18px; font-weight:800; }
.logo-text span:last-child { font-size:11px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; }
.form-title { font-family:'Syne',sans-serif; font-size:26px; font-weight:700; margin-bottom:6px; }
.form-subtitle { color:var(--muted); font-size:14px; margin-bottom:30px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-group { margin-bottom:18px; }
.form-group label { display:block; font-size:12px; color:var(--muted); margin-bottom:7px; letter-spacing:0.5px; text-transform:uppercase; }
.input-wrap { position:relative; }
.input-wrap i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--accent); font-size:14px; }
.form-control { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px; padding:13px 14px 13px 42px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; transition:all 0.3s; outline:none; }
.form-control:focus { border-color:var(--accent); background:rgba(0,212,255,0.06); box-shadow:0 0 0 3px rgba(0,212,255,0.1); }
.form-control::placeholder { color:var(--muted); }
.btn-register { width:100%; padding:14px; background:linear-gradient(135deg,var(--accent),#4f46e5); border:none; border-radius:12px; color:var(--navy); font-family:'Syne',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:all 0.3s; margin-top:6px; }
.btn-register:hover { transform:translateY(-2px); box-shadow:0 10px 40px rgba(0,212,255,0.3); }
.divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--muted); font-size:13px; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
.login-prompt { text-align:center; font-size:14px; color:var(--muted); }
.link { color:var(--accent); text-decoration:none; font-weight:500; }
.alert { padding:11px 15px; border-radius:10px; margin-bottom:18px; font-size:13px; border-left:3px solid; }
.alert-danger { background:rgba(239,68,68,0.1); border-color:#ef4444; color:#fca5a5; }
.alert-success { background:rgba(0,255,153,0.1); border-color:var(--accent2); color:var(--accent2); }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">❤️</div>
    <div class="logo-text">
      <span>MediTrack Pro</span>
      <span>Create Account</span>
    </div>
  </div>
  <div class="form-title">Join MediTrack Pro</div>
  <div class="form-subtitle">Create your patient account to start tracking your health</div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" name="full_name" class="form-control" placeholder="Dr. / Mr. / Ms." required>
        </div>
      </div>
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fas fa-at"></i>
          <input type="text" name="username" class="form-control" placeholder="unique_id" required>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" class="form-control" placeholder="Min. 8 characters" required minlength="6">
      </div>
    </div>
    <button type="submit" class="btn-register">
      <i class="fas fa-user-plus"></i> Create Account
    </button>
  </form>

  <div class="divider">or</div>
  <div class="login-prompt">
    Already have an account? <a href="/login" class="link">Sign In →</a>
  </div>
</div>
</body>
</html>
